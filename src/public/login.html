<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bus Reservation Login</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="./login.css">

</head>

<body>

    <div class="container">

        <img src="images\bus-background.jpeg" class="bg-image">

        <div class="login-card">

            <h2>Welcome Back !!</h2>

            <p>Enjoy your ride</p>

            <form action="/login" method="POST">

                <div class="input-box">
                    <i class="fa-regular fa-user"></i>
                    <input type="email" name="employeeEmail" placeholder="Enter your Email" required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="employeePassword" placeholder="Enter your Password" required>
                </div>

                <div class="login-options">

                    <label class="remember-me">
                        <input type="checkbox" name="rememberMe">
                        Remember Me
                    </label>

                    <a href="/forgot-password" class="forgot-password">
                        Forgot Password?
                    </a>

                </div>





                <button type="submit">

                    Log In

                </button>

            </form>

        </div>

    </div>

</body>

</html>
