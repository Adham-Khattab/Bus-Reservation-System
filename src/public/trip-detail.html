<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Details — All For One Group</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="trip-detail.css">
</head>

<body>

<header class="site-header">
    <a href="Dashboard.html" class="logo">
        <img src="images/logo.png" alt="All For One Group" class="logo-img">
    </a>
    <nav>
        <a href="Dashboard.html">Home</a>
        <a href="calendar.html">Booking Calendar</a>
        <a href="trip-history.html">Trip history</a>
        <a href="lost-found.html">Lost &amp; found</a>
    </nav>
    <div class="header-right">
        <span>English</span>
        <span aria-hidden="true">&#128100;</span>
    </div>
</header>

<section class="title">
    <h1>Trip Details</h1>
</section>

<section class="trip-summary">

    <div class="item">
        <div class="icon-title">
            <i class="fa-regular fa-calendar"></i>
            <p>Date</p>
        </div>
        <div class="value" id="tripDate"></div>
    </div>

    <div class="item">
        <div class="icon-title">
            <i class="fa-regular fa-clock"></i>
            <p>Time</p>
        </div>
        <div class="value" id="tripTime"></div>
    </div>

    <div class="item">
        <div class="icon-title">
            <i class="fa-solid fa-location-dot"></i>
            <p>Pick-up</p>
        </div>
        <div class="value" id="pickup"></div>
    </div>

    <div class="item">
        <div class="icon-title">
            <i class="fa-solid fa-route"></i>
            <p>Drop-off</p>
        </div>
        <div class="value" id="dropoff"></div>
    </div>

</section>

<section class="driver-details">

    <div class="row">
        <div class="left">
            <i class="fa-solid fa-user"></i>
            <div>
                <h3>Driver's Name</h3>
                <p>Driver assigned to your route</p>
            </div>
        </div>
        <div class="right" id="driverName"></div>
    </div>

    <div class="row">
        <div class="left">
            <i class="fa-solid fa-phone"></i>
            <div>
                <h3>Driver's Number</h3>
                <p>Contact your driver directly</p>
            </div>
        </div>
        <div class="right" id="driverPhone"></div>
    </div>

    <div class="row">
        <div class="left">
            <i class="fa-solid fa-bus"></i>
            <div>
                <h3>Bus Number</h3>
                <p>Your assigned bus</p>
            </div>
        </div>
        <div class="right" id="busNumber"></div>
    </div>

    <div class="row">
        <div class="left">
            <i class="fa-solid fa-chair"></i>
            <div>
                <h3>Seat Number</h3>
                <p>Your assigned seat</p>
            </div>
        </div>
        <div class="right" id="seatNumber"></div>
    </div>

</section>

<section class="buttons">
    <button id="cancelBtn">Cancel Trip</button>
    <button id="rescheduleBtn">Reschedule</button>
</section>

<footer class="site-footer">
    <a href="Dashboard.html" class="logo">
        <img src="images/logo.png" alt="All For One Group" class="logo-img">
    </a>
    <div class="footer-links">
        <a href="feedback.html">Feedback</a>
        <a href="reviews.html">Reviews</a>
        <a href="faq.html">FAQs</a>
        <a href="report.html">Report</a>
    </div>
</footer>

<script src="trip-detail.js"></script>

</body>
</html>
