<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bus Reservation Login</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="../css/login.css" />
  </head>

  <body>
    <div class="container">
      <img src="../images/bus-background.jpeg" class="bg-image" />

      <div class="login-card">
        <h2>Welcome Back !!</h2>

        <p>Enjoy your ride</p>

        <form action="/api/auth/login" method="POST" id="loginForm">
          <div class="input-box">
            <i class="fa-regular fa-user"></i>
            <input
              type="email"
              name="employeeEmail"
              placeholder="Enter your Email"
              required
            />
          </div>

          <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              name="employeePassword"
              placeholder="Enter your Password"
              required
            />
          </div>

          <div class="login-options">
            <label class="remember-me">
              <input type="checkbox" name="rememberMe" />
              Remember Me
            </label>

            <a href="./forgot-password.html" class="forgot-password">
              Forgot Password?
            </a>
          </div>

          <p
            id="errorMsg"
            style="color: #5a0000; font-size: 14px; margin-bottom: 10px"
          ></p>

          <button type="submit">Log In</button>

          <p class="account-switch">
            Don't have an account?
            <a href="./sign-up.html" class="forgot-password">Sign Up</a>
          </p>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/Login.js"></script>
  </body>
</html>
