<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="../css/login.css">

</head>

<body>

    <div class="container">

        <img src="../images/bus-background.jpeg" class="bg-image">

        <div class="login-card">

            <h2>Reset Password</h2>

            <p>Enter the code sent to your email</p>

            <form id="resetForm" autocomplete="off">

                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" name="employeeEmail" placeholder="Your Email" autocomplete="off" required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-key"></i>
                    <input type="text" name="otp" placeholder="Enter 6-digit code" maxlength="6" autocomplete="off" required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="newPassword" placeholder="Enter new password" autocomplete="new-password" required>
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="confirmPassword" placeholder="Confirm new password" autocomplete="new-password" required>
                </div>

                <p id="errorMsg" style="color:#5a0000; font-size:14px; margin-bottom:10px;"></p>
                <p id="successMsg" style="color:#0b3d0b; font-size:14px; margin-bottom:10px;"></p>

                <button type="submit">

                    Reset Password

                </button>

                <p class="account-switch">
                    Didn't get a code?
                    <a href="./forgot-password.html" class="forgot-password">Request again</a>
                </p>

            </form>

        </div>

    </div>

    <script src="../js/reset-password.js"></script>

</body>

</html>
