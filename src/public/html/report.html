<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report — All For One Group</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/report.css">
</head>
<body>

<div id="header-placeholder"></div>

<main class="page-main">
    <section class="report-card">
        <h1>Report</h1>
        <label class="report-label" for="reportText">Report the problem you faced.</label>
        <textarea id="reportText" class="report-textarea" rows="6"></textarea>
        <div class="report-submit-row">
            <button class="btn-primary" id="reportSubmit">Submit</button>
        </div>
    </section>
</main>

<div id="footer-placeholder"></div>

<script src="../js/components.js"></script>
<script src="../js/report.js"></script>
</body>
</html>
