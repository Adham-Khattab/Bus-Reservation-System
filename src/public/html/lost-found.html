<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lost &amp; Found — All For One Group</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/lostfound.css" />
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main class="page-main lostfound-main">
      <h1 class="lostfound-title">Lost &amp; found items</h1>
      <div class="lostfound-row" id="lostfoundRow"></div>
    </main>

    <div id="footer-placeholder"></div>

    <div class="modal-overlay" id="uploadModalOverlay" hidden>
      <div class="modal-card">
        <button class="modal-close" id="uploadModalClose" aria-label="Close">
          &times;
        </button>
        <h2>Upload item</h2>

        <label class="modal-label" for="itemNameInput">Item name</label>
        <input
          type="text"
          id="itemNameInput"
          class="modal-input"
          placeholder="e.g. Water bottle"
        />

        <label class="modal-label" for="busNumberInput">Bus number</label>
        <input
          type="text"
          id="busNumberInput"
          class="modal-input"
          placeholder="e.g. 12"
        />

        <label class="modal-label" for="modalFileInput">Photo</label>
        <label
          class="modal-upload-box"
          id="modalUploadBox"
          for="modalFileInput"
        >
          <span class="upload-label">
            Upload item:
            <svg class="upload-icon" viewBox="0 0 24 24" fill="none">
              <path
                d="M12 16V4M12 4L7 9M12 4L17 9"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <span class="upload-hint"
            >Images must be in JPG or PNG format and not exceed 5 MB.</span
          >
          <img class="modal-preview" id="modalPreview" hidden alt="Preview" />
        </label>
        <input
          type="file"
          id="modalFileInput"
          accept="image/jpeg,image/png"
          hidden
        />
        <p class="upload-error" id="modalError" hidden></p>

        <div class="modal-submit-row">
          <button class="btn-primary" id="modalSubmit">Submit</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/lostFound.js"></script>
  </body>
</html>
