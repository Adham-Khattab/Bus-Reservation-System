<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bus Reservation System</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/Dashboard.css" />
  </head>

  <body>
    <div id="header-placeholder"></div>

    <section class="hero">
      <img src="../images/bus-background.jpeg" class="background" />

      <div class="overlay">
        <h1>Welcome, USER 👋</h1>
        <p>Enjoy your ride!!</p>
      </div>

      <div class="booking-card">
        <div class="left-side">
          <label>Names List</label>

          <div class="employee-box">
            <input
              type="text"
              id="employeeSearch"
              placeholder="Search employee"
            />
            <button id="addEmployee">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </div>

          <div id="selectedEmployees" class="selected-tags"></div>

          <div class="direction">
            <label>
              <input type="radio" name="direction" value="To Office" checked />
              To Office
            </label>

            <label>
              <input type="radio" name="direction" value="From Office" />
              From Office
            </label>
          </div>

          <label>Pick-up Station</label>
          <select id="station">
            <option value="Mamoura">Mamoura</option>
            <option value="Montaza">Montaza</option>
            <option value="Mandara">Mandara</option>
            <option value="Asafra">Asafra</option>
            <option value="Miami">Miami</option>
            <option value="Sidi Bishr">Sidi Bishr</option>
            <option value="Mohamed Nagib">Mohamed Nagib</option>
            <option value="Victoria">Victoria</option>
            <option value="Loran">Loran</option>
            <option value="Ganaklis">Ganaklis</option>
            <option value="Gleem">Gleem</option>
            <option value="Bokla">Bokla</option>
            <option value="Roushdy">Roushdy</option>
            <option value="Mostafa Kamel">Mostafa Kamel</option>
            <option value="Sidi Gaber">Sidi Gaber</option>
            <option value="Cleopatra">Cleopatra</option>
            <option value="Sporting">Sporting</option>
            <option value="Ibrahimya">Ibrahimya</option>
          </select>

          <label>Travel Date</label>
          <input type="date" id="travelDate" />

          <label>Pick-up Time</label>

          <select id="pickupTime">
            <option value="08:00">8:00 AM</option>
            <option value="09:00">9:00 AM</option>
            <option value="10:00">10:00 AM</option>
            <option value="17:00">5:00 PM</option>
            <option value="18:00">6:00 PM</option>
            <option value="19:00">7:00 PM</option>
          </select>
        </div>

        <div class="right-side">
          <h2>Choose Your Seat</h2>

          <div class="seat-grid">
            <button class="seat">10</button>
            <button class="seat">11</button>
            <button class="seat">12</button>
            <button class="seat">7</button>
            <button class="seat">8</button>
            <button class="seat">9</button>
            <button class="seat">4</button>
            <button class="seat">5</button>
            <button class="seat">6</button>
            <button class="seat">1</button>
            <button class="seat">2</button>
            <button class="seat">3</button>
          </div>

          <div class="legend">
            <div>
              <span class="box selected"></span>
              Selected
            </div>
            <div>
              <span class="box occupied"></span>
              Occupied
            </div>
            <div>
              <span class="box available"></span>
              Available
            </div>
          </div>
          <button id="bookBtn" class="book-btn">Book Now!</button>
        </div>
      </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="../js/components.js"></script>
    <script src="../js/dashboard.js"></script>
  </body>
</html>
