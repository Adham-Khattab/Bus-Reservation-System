<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="../css/login.css">

</head>

<body>

    <div class="container">

        <img src="../images/bus-background.jpeg" class="bg-image">

        <div class="login-card">

            <h2>Forgot Password?</h2>

            <p>Enter your email and we'll send you a reset code</p>

            <form id="forgotForm" autocomplete="off">

                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" name="employeeEmail" placeholder="Enter your Email" autocomplete="off" required>
                </div>

                <p id="errorMsg" style="color:#5a0000; font-size:14px; margin-bottom:10px;"></p>
                <p id="successMsg" style="color:#0b3d0b; font-size:14px; margin-bottom:10px;"></p>

                <button type="submit">

                    Send Reset Code

                </button>

                <p class="account-switch">
                    Remembered your password?
                    <a href="./login.html" class="forgot-password">Log In</a>
                </p>

            </form>

        </div>

    </div>

    <script src="../js/forgot-password.js"></script>

</body>

</html>
